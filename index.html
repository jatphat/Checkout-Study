<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Study</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0; --surface: #FFFFFF; --text: #1A1A18; --muted: #6B6B65;
    --accent: #2B5E3F; --accent-light: #EAF2ED; --border: #E0DDD6;
    --warning: #C84B0F; --warning-light: #FDF0EA;
    --success: #1A6B3C; --success-light: #D6F0E2;
    --shadow: 0 2px 16px rgba(0,0,0,0.07); --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px 80px; }
  .container { width: 100%; max-width: 740px; }
  .screen { display: none; animation: fadeIn 0.3s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

  .progress-wrap { margin-bottom: 36px; }
  .progress-bar { height: 3px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s ease; }
  .progress-label { font-size: 0.72rem; color: var(--muted); margin-top: 6px; letter-spacing: 0.04em; text-transform: uppercase; }

  h1 { font-family: 'DM Serif Display', serif; font-size: 1.9rem; line-height: 1.2; margin-bottom: 10px; }
  h2 { font-family: 'DM Serif Display', serif; font-size: 1.25rem; margin-bottom: 14px; }
  p { color: var(--muted); line-height: 1.65; margin-bottom: 14px; font-size: 0.93rem; }
  label { display: block; font-size: 0.84rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .section-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }

  .shipping-banner { border-radius: var(--radius); padding: 14px 18px; margin-bottom: 18px; display: flex; align-items: center; gap: 12px; transition: background 0.4s, border-color 0.4s; }
  .shipping-banner.danger { background: var(--warning-light); border: 1.5px solid var(--warning); }
  .shipping-banner.success { background: var(--success-light); border: 1.5px solid var(--success); }
  .shipping-banner .icon { font-size: 1.3rem; flex-shrink: 0; }
  .shipping-banner .banner-text strong { font-size: 0.92rem; }
  .shipping-banner .banner-text span { font-size: 0.82rem; color: var(--muted); display: block; margin-top: 2px; }

  .cart-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .cart-item:last-child { border-bottom: none; }
  .item-emoji { font-size: 1.6rem; width: 40px; text-align: center; flex-shrink: 0; }
  .item-info { flex: 1; }
  .item-name { font-weight: 500; font-size: 0.92rem; }
  .item-cat { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .item-price { font-weight: 600; font-size: 0.92rem; flex-shrink: 0; }

  .cart-footer { padding-top: 14px; margin-top: 4px; }
  .cart-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; margin-bottom: 6px; }
  .cart-row.total { font-weight: 700; font-size: 1rem; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 6px; }
  .shipping-line { color: var(--warning); font-size: 0.85rem; }

  .rec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .rec-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s; position: relative; user-select: none; }
  .rec-card:hover { border-color: var(--accent); box-shadow: 0 4px 18px rgba(43,94,63,0.1); transform: translateY(-2px); }
  .rec-card.selected { border-color: var(--accent); background: var(--accent-light); }
  .rec-card .rec-emoji { font-size: 1.5rem; margin-bottom: 7px; }
  .rec-card .rec-name { font-weight: 500; font-size: 0.84rem; line-height: 1.3; margin-bottom: 5px; }
  .rec-card .rec-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .rec-card .rec-price { font-weight: 700; color: var(--accent); font-size: 0.92rem; }
  .rec-card .rec-cat { font-size: 0.72rem; color: var(--muted); background: var(--bg); padding: 2px 6px; border-radius: 99px; }
  .rec-card .rec-explanation { margin-top: 8px; font-size: 0.76rem; color: var(--muted); line-height: 1.45; border-top: 1px solid var(--border); padding-top: 8px; }
  .rec-card .check-badge { position: absolute; top: 9px; right: 9px; width: 20px; height: 20px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.65rem; font-weight: 700; }
  .rec-card .gap-badge { position: absolute; top: 9px; right: 9px; background: var(--accent); color: white; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 99px; text-transform: uppercase; }

  #live-cart-panel { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  #live-cart-panel .panel-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  #live-cart-panel .added-items { margin-bottom: 10px; }
  #live-cart-panel .added-item { display:flex; justify-content:space-between; align-items:center; font-size:0.84rem; padding: 4px 0; }
  #live-cart-panel .added-item .ai-name { color: var(--text); font-weight:500; }
  #live-cart-panel .added-item .ai-remove { background:none; border:none; color:var(--muted); cursor:pointer; font-size:0.8rem; padding:2px 4px; border-radius:4px; }
  #live-cart-panel .added-item .ai-remove:hover { color:var(--warning); }
  .panel-totals { border-top: 1px solid var(--border); padding-top: 10px; }
  .panel-row { display:flex; justify-content:space-between; font-size:0.84rem; margin-bottom:4px; color:var(--muted); }
  .panel-row.bold { font-weight:700; color:var(--text); font-size:0.92rem; }
  .gap-indicator { font-size: 0.8rem; margin-top: 6px; padding: 6px 10px; border-radius: 6px; text-align: center; font-weight: 600; }
  .gap-indicator.short { background: var(--warning-light); color: var(--warning); }
  .gap-indicator.met { background: var(--success-light); color: var(--success); }

  .btn { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 13px 24px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; width: 100%; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #214a30; }
  .btn-secondary { background: transparent; color: var(--muted); border: 1.5px solid var(--border); margin-top: 8px; }
  .btn-secondary:hover { border-color: var(--muted); color: var(--text); }
  .btn-danger { background: transparent; color: var(--warning); border: 1.5px solid var(--warning); margin-top: 8px; }
  .btn-danger:hover { background: var(--warning-light); }

  /* Survey shared styles */
  .survey-group { margin-bottom: 26px; }
  .survey-group:last-child { margin-bottom: 0; }
  .likert { display: flex; gap: 6px; margin-top: 7px; }
  .likert > div { flex: 1; }
  .likert input { display: none; }
  .likert label { display: block; text-align: center; cursor: pointer; background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 2px; font-size: 0.78rem; font-weight: 400; color: var(--muted); transition: all 0.15s; }
  .likert input:checked + label { background: var(--accent-light); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .scale-labels { display: flex; justify-content: space-between; font-size: 0.68rem; color: var(--muted); margin-top: 3px; }
  .radio-group { display: flex; flex-direction: column; gap: 7px; margin-top: 7px; }
  .radio-opt { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.15s; }
  .radio-opt:hover { border-color: var(--accent); }
  .radio-opt input { accent-color: var(--accent); }
  .radio-opt span { font-size: 0.88rem; }

  /* Checkbox grid for exit reasons */
  .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .check-opt { display: flex; align-items: center; gap: 9px; padding: 10px 13px; border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.15s; font-size: 0.86rem; }
  .check-opt:hover { border-color: var(--accent); }
  .check-opt input { accent-color: var(--accent); width: 15px; height: 15px; flex-shrink: 0; }
  .check-opt.checked { border-color: var(--accent); background: var(--accent-light); }

  /* Free text */
  textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; color: var(--text); background: var(--bg); resize: vertical; min-height: 80px; outline: none; transition: border-color 0.2s; line-height: 1.55; }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }
  .char-count { font-size: 0.72rem; color: var(--muted); text-align: right; margin-top: 4px; }

  /* Exit screen accent */
  .exit-header { background: var(--warning-light); border: 1.5px solid var(--warning); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
  .exit-header .icon { font-size: 1.4rem; flex-shrink: 0; }
  .exit-header p { margin: 0; color: var(--warning); font-size: 0.88rem; font-weight: 500; }

  .scenario-box { background: var(--accent-light); border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0; padding: 14px 18px; margin: 16px 0; }
  .scenario-box p { color: var(--text); margin: 0; font-size: 0.9rem; }

  #inactivity-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); z-index: 999; align-items: center; justify-content: center; }
  #inactivity-overlay.show { display: flex; }
  .inactivity-box { background: var(--surface); border-radius: var(--radius); padding: 32px; max-width: 360px; width: 90%; text-align: center; }
  .inactivity-box h2 { margin-bottom: 10px; }
  .inactivity-box p { font-size: 0.88rem; margin-bottom: 20px; }
  .inactivity-countdown { font-size: 2rem; font-weight: 700; color: var(--warning); margin-bottom: 16px; }

  #debug-badge { position: fixed; bottom: 10px; right: 10px; background: #111; color: #888; font-size: 0.68rem; font-family: monospace; padding: 5px 9px; border-radius: 6px; opacity: 0.75; z-index: 100; }
  .thankyou-icon { font-size: 2.8rem; margin-bottom: 14px; }
  @media (max-width: 500px) { .rec-grid { grid-template-columns: 1fr; } h1 { font-size: 1.5rem; } .checkbox-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div class="progress-label" id="progress-label">Step 1 of 8 — Study Information</div>
  </div>
  <div id="app"></div>
</div>

<div id="inactivity-overlay">
  <div class="inactivity-box">
    <div style="font-size:2rem;margin-bottom:8px">⏱️</div>
    <h2>Still there?</h2>
    <p>You've been inactive. Your session will be recorded as <strong>abandoned</strong> in:</p>
    <div class="inactivity-countdown" id="countdown-num">30</div>
    <button class="btn btn-primary" onclick="resetInactivity()" style="width:100%">I'm still here</button>
  </div>
</div>

<div id="debug-badge">Cond <span id="debug-cond">—</span> | <span id="debug-screen">consent</span></div>

<script>
// ════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════

const INACTIVITY_WARN_SEC  = 90;

const FIELD_MAP = {

  fit1:                   "entry.2089146456",

  manCheck1:              "entry.656307787",

  manCheck3:              "entry.1638538059",

  // ── EXIT SURVEY fields — add these to your Google Form then fill in entry IDs ──
  // exitManip1:          "entry.XXXXXXXXX",  // "felt pressured" (maps to manip scale)
  // exitManip2:          "entry.XXXXXXXXX",  // "felt manipulated"
  // exitTrust1:          "entry.XXXXXXXXX",  // "recommendations trustworthy"
  // exitTransp1:         "entry.XXXXXXXXX",  // "understood why items recommended"
  // exitLoad1:           "entry.XXXXXXXXX",  // "mentally demanding"
  // exitPrimaryReason:   "entry.XXXXXXXXX",  // coded primary abandon reason
  // exitReasonsChecked:  "entry.XXXXXXXXX",  // pipe-delimited checked reasons
  // exitFreeText:        "entry.XXXXXXXXX",  // open-ended comments
  // exitSuggestion:      "entry.XXXXXXXXX",  // what would have helped
  // exitItemsAdded:      "entry.XXXXXXXXX",  // how many items added before abandoning
  // exitGapAtAbandon:    "entry.XXXXXXXXX",  // remaining gap when they left
  // exitTimeOnScreen:    "entry.XXXXXXXXX",  // seconds on rec screen before abandoning
  // exitHoverCount:      "entry.XXXXXXXXX",  // number of hover events (engagement)
  // exitAddThenRemove:   "entry.XXXXXXXXX",  // 1 if participant added then removed items
  // recDeviationScore:   "entry.XXXXXXXXX",  // H6 moderator
  // touchDevice:         "entry.XXXXXXXXX",
   recDeviationScore: "entry.1648697782",
  touchDevice: "entry.257967857" ,
   exitManip1:          "entry.1900160483",  // "felt pressured" (maps to manip scale)
  exitManip2:          "entry.115935025",  // "felt manipulated"
  exitTrust1:          "entry.977674086",  // "recommendations trustworthy"
  exitTransp1:         "entry.575325771",  // "understood why items recommended"
   exitLoad1:           "entry.1906937013",  // "mentally demanding"
  exitPrimaryReason:   "entry.1421685344",  // coded primary abandon reason
  exitReasonsChecked:  "entry.1111071683",  // pipe-delimited checked reasons
   exitFreeText:        "entry.227332894",  // open-ended comments
   exitSuggestion:      "entry.1897370611",  // what would have helped
   exitItemsAdded:      "entry.457722614",  // how many items added before abandoning
   exitGapAtAbandon:    "entry.1893427120",  // remaining gap when they left
   exitTimeOnScreen:    "entry.973032317",  // seconds on rec screen before abandoning
   exitHoverCount:      "entry.481529522",  // number of hover events (engagement)
  exitAddThenRemove:    "entry.154643064",
};

// ════════════════════════════════════════════════════════════
// CATALOG — AMCIS Amazon Reviews 2023 categories
// ════════════════════════════════════════════════════════════
const CATALOG = [
  { id:"h1", name:"Vitamin C Serum 30ml",            cat:"Health & Personal Care", price:8.99,  pop:9, rel:8, emoji:"🧴" },
  { id:"h2", name:"Collagen Face Moisturizer",       cat:"Health & Personal Care", price:11.49, pop:8, rel:8, emoji:"✨" },
  { id:"h3", name:"Melatonin Gummies 60ct",          cat:"Health & Personal Care", price:9.99,  pop:9, rel:7, emoji:"💊" },
  { id:"h4", name:"Zinc + Vitamin D Tablets",        cat:"Health & Personal Care", price:7.49,  pop:8, rel:7, emoji:"💊" },
  { id:"h5", name:"Natural Lip Balm Set (4pk)",      cat:"Health & Personal Care", price:5.99,  pop:8, rel:6, emoji:"💋" },

  { id:"b2", name:"Rose Water Facial Mist",          cat:"All Beauty",             price:7.99,  pop:8, rel:7, emoji:"🌹" },

  { id:"o2", name:"Gel Pen Set 0.5mm (10pk)",        cat:"Office Products",        price:6.99,  pop:9, rel:8, emoji:"🖊️" },
  { id:"o3", name:"Mini Stapler + 1000 Staples",     cat:"Office Products",        price:7.49,  pop:8, rel:7, emoji:"📎" },
  { id:"o4", name:"Cable Management Clips 20pk",     cat:"Office Products",        price:5.99,  pop:8, rel:7, emoji:"🔌" },
];

// Cart subtotal $26.47 → gap $8.53 (AMCIS $5–$15 decision zone)
const CART_ITEMS = [
  { name:"Daily Multivitamin 90ct",        cat:"Health & Personal Care", price:10.49, emoji:"💊" },
  { name:"Micellar Cleansing Water",       cat:"All Beauty",             price:9.99,  emoji:"💧" },
  { name:"Chamomile Herbal Tea (20 bags)", cat:"Grocery & Gourmet",      price:5.99,  emoji:"🍵" },
];
const CART_SUBTOTAL = +(CART_ITEMS.reduce((s,i)=>s+i.price,0).toFixed(2));
const GAP_INITIAL   = +(THRESHOLD - CART_SUBTOTAL).toFixed(2);

// ════════════════════════════════════════════════════════════
// SESSION STATE
// ════════════════════════════════════════════════════════════
const participantId = "P_" + Date.now() + "_" + Math.random().toString(36).slice(2,6).toUpperCase();
const condition     = Math.floor(Math.random()*4)+1;
const isDSS         = condition >= 3;
const hasExp        = condition === 2 || condition === 4;
const touchDevice   = ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? 1 : 0;

document.getElementById("debug-cond").textContent =
  condition + (isDSS?" DSS":" Static") + (hasExp?" +Exp":" No Exp");

let sessionData = {
  participantId, condition,
  conditionDSS: isDSS ? 1 : 0,
  conditionExp: hasExp ? 1 : 0,
  cartSubtotal: CART_SUBTOTAL.toFixed(2),
  gapAtStart:   GAP_INITIAL.toFixed(2),
  abandonType:  "none",
  touchDevice,
};

let addedItems         = [];
let itemsAddedThenRemoved = 0; // tracks add→remove behavior (indecision signal)
let shownRecs          = [];
let recScreenEnter     = null;
let firstSelectionTime = null;
let hoverLog           = [];
let inactivityTimer    = null;
let countdownTimer     = null;
let countdownVal       = INACTIVITY_ABANDON_SEC;
let sessionStartTime   = Date.now();

// ════════════════════════════════════════════════════════════
// SCREEN MANAGEMENT
// ════════════════════════════════════════════════════════════
// Now 8 screens — exit survey inserted between recommendations and debrief
const SCREENS = ["consent","prescreener","scenario","cart","recommendations","exitsurvey","posttask","debrief"];
const SCREEN_LABELS = [
  "Step 1 of 8 — Study Information",
  "Step 2 of 8 — Background Questions",
  "Step 3 of 8 — Shopping Scenario",
  "Step 4 of 8 — Your Cart",
  "Step 5 of 8 — Add-on Recommendations",
  "Step 6 of 8 — Brief Exit Questions",
  "Step 6 of 8 — Post-Task Survey",
  "Step 8 of 8 — Complete",
];
const SCREEN_PROGRESS = [5,16,28,42,57,75,82,100];
let currentScreenIdx = 0;

function setScreen(name) {
  currentScreenIdx = SCREENS.indexOf(name);
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-"+name).classList.add("active");
  document.getElementById("progress").style.width       = SCREEN_PROGRESS[currentScreenIdx]+"%";
  document.getElementById("progress-label").textContent = SCREEN_LABELS[currentScreenIdx];
  document.getElementById("debug-screen").textContent   = name;
  window.scrollTo(0,0);

  if (name === "recommendations") {
    recScreenEnter = Date.now();
    startInactivityWatch();
    refreshAddonQualityCard();
  } else {
    stopInactivityWatch();
  }
  if (name === "posttask") refreshAddonQualityCard();
}

// 1. Page close / navigation
window.addEventListener("beforeunload", function(e) {
  if (currentScreenIdx === 4 && sessionData.checkoutCompleted === undefined) {
    sessionData.abandonType = "pagetransition";
    sessionData.checkoutCompleted = 0;
    recordTimingsAndItems(false);
    flushData();
    e.preventDefault();
    e.returnValue = "";
  }
});

// 2. Inactivity
function startInactivityWatch() {
  stopInactivityWatch();
  inactivityTimer = setTimeout(showInactivityWarning, INACTIVITY_WARN_SEC * 1000);
  ["mousemove","keydown","click","touchstart"].forEach(ev =>
    document.addEventListener(ev, resetInactivityOnMove));
}
function stopInactivityWatch() {
  clearTimeout(inactivityTimer);
  clearInterval(countdownTimer);
  ["mousemove","keydown","click","touchstart"].forEach(ev =>
    document.removeEventListener(ev, resetInactivityOnMove));
  hideInactivityOverlay();
}
function resetInactivityOnMove() { resetInactivity(); }
function resetInactivity() {
  hideInactivityOverlay();
  clearTimeout(inactivityTimer);
  clearInterval(countdownTimer);
  inactivityTimer = setTimeout(showInactivityWarning, INACTIVITY_WARN_SEC * 1000);
}
function showInactivityWarning() {
  countdownVal = INACTIVITY_ABANDON_SEC;
  document.getElementById("countdown-num").textContent = countdownVal;
  document.getElementById("inactivity-overlay").classList.add("show");
  countdownTimer = setInterval(function() {
    countdownVal--;
    document.getElementById("countdown-num").textContent = countdownVal;
    if (countdownVal <= 0) { clearInterval(countdownTimer); triggerInactivityAbandon(); }
  }, 1000);
}
function hideInactivityOverlay() {
  document.getElementById("inactivity-overlay").classList.remove("show");
  clearInterval(countdownTimer);
}
function triggerInactivityAbandon() {
  hideInactivityOverlay();
  sessionData.abandonType = "inactivity";
  sessionData.checkoutCompleted = 0;
  recordTimingsAndItems(false);
  // Inactivity abandons go straight to debrief (no exit survey — participant is gone)
  flushData();
  document.getElementById("debrief-note").textContent =
    "Your session was recorded as incomplete due to inactivity.";
  setScreen("debrief");
}

// 3. Explicit button abandon → exit survey
function abandonCart() {
  stopInactivityWatch();
  sessionData.abandonType = "button";
  sessionData.checkoutCompleted = 0;
  recordTimingsAndItems(false);
  setScreen("exitsurvey"); // goes to exit survey, not debrief directly
}

// ════════════════════════════════════════════════════════════
// RECOMMENDATION LOGIC
// ════════════════════════════════════════════════════════════
function getStaticRecs(n=5) {
  return [...CATALOG].sort((a,b)=>b.pop-a.pop).slice(0,n);
}
function getDSSRecs(currentTotal, n=5) {
  const gap = Math.max(0, +(THRESHOLD - currentTotal).toFixed(2));
  return [...CATALOG]
    .filter(item => !addedItems.find(a=>a.id===item.id))
    .map(item => {
      const gapFit = Math.max(0, 1 - Math.abs(item.price - gap) / Math.max(gap,1));
      const score  = (0.45*(item.rel/10)) + (0.35*gapFit) + (0.20*(item.pop/10));
      return { ...item, score };
    })
    .sort((a,b)=>b.score-a.score)
    .slice(0,n);
}
function computeRecDeviationScore() {
  const staticIds = new Set(getStaticRecs(5).map(r=>r.id));
  const dssIds    = new Set(getDSSRecs(getCurrentTotal(), 5).map(r=>r.id));
  const overlap   = [...staticIds].filter(id=>dssIds.has(id)).length;
  return +(1 - overlap/5).toFixed(2);
}
function getExplanation(item, currentTotal) {
  const newTotal = +(currentTotal + item.price).toFixed(2);
  if (newTotal >= THRESHOLD) {
    return `Adding this item brings your total to $${newTotal.toFixed(2)}, qualifying for free shipping and saving you $5.99 in fees.`;
  }
  const remaining = +(THRESHOLD - newTotal).toFixed(2);
  return `This item fits your cart and reduces your shipping gap to $${remaining.toFixed(2)}. It matches your purchase history in ${item.cat}.`;
}

// ════════════════════════════════════════════════════════════
// CART STATE
// ════════════════════════════════════════════════════════════
function getCurrentTotal() { return +(CART_SUBTOTAL + addedItems.reduce((s,i)=>s+i.price,0)).toFixed(2); }
function getCurrentGap()   { return Math.max(0, +(THRESHOLD - getCurrentTotal()).toFixed(2)); }
function isGapCleared()    { return getCurrentTotal() >= THRESHOLD; }

// ════════════════════════════════════════════════════════════
// UI HELPERS
// ════════════════════════════════════════════════════════════
function buildLikert(name, n=7) {
  return `<div class="likert">${Array.from({length:n},(_,i)=>`<div><input type="radio" name="${name}" id="${name}_${i+1}" value="${i+1}"><label for="${name}_${i+1}">${i+1}</label></div>`).join("")}</div>`;
}
function getRadio(name) {
  const el = document.querySelector(`input[name="${name}"]:checked`);
  return el ? el.value : "";
}
function refreshAddonQualityCard() {
  const card = document.getElementById("addon-quality-card");
  if (card) card.style.display = addedItems.length > 0 ? "block" : "none";
}
function updateBanner() {
  const banner = document.getElementById("rec-banner");
  if (!banner) return;
  const cleared = isGapCleared();
  banner.className = "shipping-banner " + (cleared ? "success" : "danger");
  banner.innerHTML = `
    <span class="icon">${cleared?"✅":"🚚"}</span>
    <div class="banner-text">
      <strong>${cleared ? "Free shipping unlocked! 🎉" : `Add $${getCurrentGap().toFixed(2)} more for FREE shipping`}</strong>
      <span>${cleared
        ? `Your total is $${getCurrentTotal().toFixed(2)} — you qualify for free shipping!`
        : `Orders $35+ ship free. Current shipping fee: $5.99.`}</span>
    </div>`;
}
function updateLivePanel() {
  const panel = document.getElementById("live-cart-panel");
  if (!panel) return;
  const total = getCurrentTotal();
  const cleared = isGapCleared();
  const addedSum = addedItems.reduce((s,i)=>s+i.price,0);
  const addedHTML = addedItems.length === 0
    ? `<p style="font-size:0.8rem;color:var(--muted);margin:0">No items added yet.</p>`
    : addedItems.map(item=>`
      <div class="added-item">
        <span class="ai-name">${item.emoji} ${item.name}</span>
        <span style="display:flex;align-items:center;gap:6px">
          <span style="font-weight:600;font-size:0.84rem">$${item.price.toFixed(2)}</span>
          <button class="ai-remove" onclick="removeAddon('${item.id}')">✕</button>
        </span>
      </div>`).join("");
  panel.innerHTML = `
    <div class="panel-title">Your updated cart</div>
    <div class="added-items">${addedHTML}</div>
    <div class="panel-totals">
      <div class="panel-row"><span>Original subtotal</span><span>$${CART_SUBTOTAL.toFixed(2)}</span></div>
      ${addedItems.length>0?`<div class="panel-row"><span>Add-ons (×${addedItems.length})</span><span>+$${addedSum.toFixed(2)}</span></div>`:""}
      <div class="panel-row bold"><span>New total</span><span>$${total.toFixed(2)}</span></div>
    </div>
    <div class="gap-indicator ${cleared?"met":"short"}">
      ${cleared ? "✓ Free shipping threshold met!" : `$${getCurrentGap().toFixed(2)} away from free shipping`}
    </div>`;
}
function renderRecs() {
  const total = getCurrentTotal();
  shownRecs = isDSS
    ? getDSSRecs(total, 5)
    : getStaticRecs(5).filter(i=>!addedItems.find(a=>a.id===i.id)).slice(0,5);
  sessionData.addonsShown = shownRecs.map(r=>r.name).join("|");
  const grid = document.getElementById("rec-grid");
  if (!grid) return;
  grid.innerHTML = shownRecs.map(item => {
    const isSelected = !!addedItems.find(a=>a.id===item.id);
    const clears = (+(total + item.price).toFixed(2)) >= THRESHOLD && !isSelected;
    return `
    <div class="rec-card ${isSelected?"selected":""}" id="rec-${item.id}"
      onclick="toggleAddon('${item.id}')"
      onmouseenter="logHover('${item.id}','enter')"
      onmouseleave="logHover('${item.id}','leave')">
      ${isSelected
        ? `<div class="check-badge">✓</div>`
        : (clears && !hasExp ? `<div class="gap-badge">Clears gap</div>` : "")}
      <div class="rec-emoji">${item.emoji}</div>
      <div class="rec-name">${item.name}</div>
      <div class="rec-meta">
        <span class="rec-price">$${item.price.toFixed(2)}</span>
        <span class="rec-cat">${item.cat.split(" &")[0]}</span>
      </div>
      ${hasExp ? `<div class="rec-explanation">💡 ${getExplanation(item, total)}</div>` : ""}
    </div>`;
  }).join("");
}
function logHover(id, type) {
  if (recScreenEnter) hoverLog.push({ id, type, ms: Math.round(Date.now() - recScreenEnter) });
}
function toggleAddon(id) {
  if (addedItems.find(a=>a.id===id)) { removeAddon(id); return; }
  const item = CATALOG.find(c=>c.id===id);
  if (!item) return;
  addedItems.push(item);
  if (!firstSelectionTime) firstSelectionTime = Date.now();
  renderRecs(); updateBanner(); updateLivePanel(); refreshAddonQualityCard();
}
function removeAddon(id) {
  if (addedItems.find(a=>a.id===id)) itemsAddedThenRemoved++;
  addedItems = addedItems.filter(a=>a.id!==id);
  renderRecs(); updateBanner(); updateLivePanel(); refreshAddonQualityCard();
}

// ════════════════════════════════════════════════════════════
// TIMINGS & ITEM RECORDING
// ════════════════════════════════════════════════════════════
function recordTimingsAndItems(completed) {
  const now = Date.now();
  sessionData.timeOnRecScreen      = recScreenEnter ? Math.round((now - recScreenEnter)/1000) : 0;
  sessionData.timeToFirstSelection = firstSelectionTime
    ? Math.round((firstSelectionTime - recScreenEnter)/1000) : "none";
  sessionData.checkoutCompleted    = completed ? 1 : 0;
  sessionData.addonCount           = addedItems.length;
  sessionData.addonsSelected       = addedItems.length > 0 ? 1 : 0;
  sessionData.addonNames           = addedItems.map(i=>i.name).join("|");
  sessionData.addonPrices          = addedItems.map(i=>i.price.toFixed(2)).join("|");
  sessionData.finalTotal           = getCurrentTotal().toFixed(2);
  sessionData.gapCleared           = isGapCleared() ? 1 : 0;
  sessionData.hoverEvents          = JSON.stringify(hoverLog);
  sessionData.recDeviationScore    = computeRecDeviationScore();
  sessionData.sessionDurationSeconds = Math.round((now - sessionStartTime)/1000);
  // Exit-specific computed metrics
  sessionData.exitItemsAdded       = addedItems.length;
  sessionData.exitGapAtAbandon     = getCurrentGap().toFixed(2);
  sessionData.exitTimeOnScreen     = sessionData.timeOnRecScreen;
  sessionData.exitHoverCount       = hoverLog.filter(h=>h.type==="enter").length;
  sessionData.exitAddThenRemove    = itemsAddedThenRemoved > 0 ? 1 : 0;
}

function completeCheckout() {
  stopInactivityWatch();
  sessionData.abandonType = "none";
  recordTimingsAndItems(true);
  setScreen("posttask");
}
function goToRecs() {
  addedItems = []; hoverLog = []; firstSelectionTime = null; itemsAddedThenRemoved = 0;
  setScreen("recommendations");
  renderRecs(); updateBanner(); updateLivePanel();
}

function submitExitSurvey() {
  // Only require the primary reason — everything else is optional to reduce friction
  const primaryReason = getRadio("exitPrimaryReason");
  if (!primaryReason) {
    alert("Please select at least one reason for leaving before continuing.");
    return;
  }

  // Collect checked reasons (multi-select)
  const checkedReasons = [...document.querySelectorAll('input[name="exitReasonCheck"]:checked')]
    .map(el => el.value).join("|");

  // Mechanism measures
  sessionData.exitManip1   = getRadio("exitManip1");
  sessionData.exitManip2   = getRadio("exitManip2");
  sessionData.exitTrust1   = getRadio("exitTrust1");
  sessionData.exitTransp1  = getRadio("exitTransp1");
  sessionData.exitLoad1    = getRadio("exitLoad1");

  // Reason coding
  sessionData.exitPrimaryReason  = primaryReason;
  sessionData.exitReasonsChecked = checkedReasons;

  // Free text
  sessionData.exitFreeText   = (document.getElementById("exitFreeText")?.value || "").trim().slice(0,500);
  sessionData.exitSuggestion = (document.getElementById("exitSuggestion")?.value || "").trim().slice(0,500);

  flushData();
  document.getElementById("debrief-note").textContent = "";
  setScreen("debrief");
}

function submitPrescreener() {
  const freq  = getRadio("shopFreq");
  const price = getRadio("priceSensitivity");
  const trust = getRadio("algoTrust");
  if (!freq || !price || !trust) { alert("Please answer all questions before continuing."); return; }
  sessionData.shopFreq = freq; sessionData.priceSensitivity = price; sessionData.algoTrust = trust;
  setScreen("scenario");
}
function submitSurvey() {
  const required = ["trust1","trust2","trust3","transp1","transp2","manip1","manip2",
                    "conf1","load1","load2","load3","manCheck1","manCheck2","manCheck3"];
  if (addedItems.length > 0) required.push("fit1","regret1","value1");
  const missing = required.filter(f=>!getRadio(f));
  if (missing.length > 0) { alert("Please answer all questions before submitting."); return; }
  required.forEach(f=>{ sessionData[f] = getRadio(f); });
  flushData();
  document.getElementById("debrief-note").textContent = "";
  setScreen("debrief");
}

// ════════════════════════════════════════════════════════════
// DATA SUBMISSION
// ════════════════════════════════════════════════════════════
function flushData() {
  const fd = new FormData();
  Object.keys(FIELD_MAP).forEach(key => {
    const entryId = FIELD_MAP[key];
    // Skip comment-only entries (no real entry ID yet)
    if (!entryId || !entryId.startsWith("entry.")) return;
    if (sessionData[key] !== undefined && sessionData[key] !== null) {
      fd.append(entryId, sessionData[key]);
    }
  });
  fetch(GOOGLE_FORM_ACTION, { method:"POST", body:fd, mode:"no-cors" }).catch(()=>{});
  console.log("=== STUDY 2 SESSION DATA ===\n" + JSON.stringify(sessionData, null, 2));
}

// Char counter helper
function updateCharCount(textareaId, counterId, max) {
  const ta = document.getElementById(textareaId);
  const ct = document.getElementById(counterId);
  if (ta && ct) { ct.textContent = max - ta.value.length + " characters remaining"; }
}

    <div class="section-label">Quick Reactions — How did the recommendations feel?</div>
    <div class="survey-group">
      <label>The recommendations felt designed to pressure me into spending more. <span style="font-weight:400;color:var(--muted)">(1–7)</span></label>
      ${buildLikert("exitManip1")}
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
    <div class="survey-group">
      <label>I felt manipulated by the suggestions. <span style="font-weight:400;color:var(--muted)">(1–7)</span></label>
      ${buildLikert("exitManip2")}
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
    <div class="survey-group">
      <label>I understood why these specific items were recommended. <span style="font-weight:400;color:var(--muted)">(1–7)</span></label>
      ${buildLikert("exitTransp1")}
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
    <div class="survey-group">
      <label>The recommendations were trustworthy. <span style="font-weight:400;color:var(--muted)">(1–7)</span></label>
      ${buildLikert("exitTrust1")}
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
    <div class="survey-group" style="margin-bottom:0">
      <label>This decision felt mentally demanding. <span style="font-weight:400;color:var(--muted)">(1–7)</span></label>
      ${buildLikert("exitLoad1")}
      <div class="scale-labels"><span>Very low</span><span>Very high</span></div>
    </div>
  </div>

  <div class="card">
    <div class="section-label">Optional — In your own words</div>
    <div class="survey-group">
      <label>Is there anything else that influenced your decision to leave? <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <textarea id="exitFreeText" maxlength="500" placeholder="e.g. The items didn't match what I already had in my cart..."
        oninput="updateCharCount('exitFreeText','exitFreeTextCount',500)"></textarea>
      <div class="char-count" id="exitFreeTextCount">500 characters remaining</div>
    </div>
    <div class="survey-group" style="margin-bottom:0">
      <label>What would have made you more likely to complete the purchase? <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
      <textarea id="exitSuggestion" maxlength="500" placeholder="e.g. If the recommendations had included lower-priced items that fit my gap exactly..."
        oninput="updateCharCount('exitSuggestion','exitSuggestionCount',500)"></textarea>
      <div class="char-count" id="exitSuggestionCount">500 characters remaining</div>
    </div>
  </div>

  <button class="btn btn-primary" onclick="submitExitSurvey()">Submit &amp; Finish →</button>
  <p style="font-size:0.75rem;text-align:center;margin-top:10px;color:var(--muted);font-style:italic">Only the primary reason above is required. All other fields are optional.</p>
</div>

<!-- ⑦ POST-TASK SURVEY (completers) -->
<div class="screen" id="screen-posttask">
  <div class="section-label">Post-Task Survey</div>
  <h1>Almost done</h1>
  <p>Please rate your experience with the product recommendations you just saw.</p>

  <div class="card">
    <div class="section-label">Trust in Recommendations</div>
    <div class="survey-group">
      <label>The product recommendations were trustworthy.</label>
      ${buildLikert("trust1")}
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
    <div class="survey-group">
      <label>I felt confident relying on these recommendations.</label>
      ${buildLikert("trust2")}
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
    <div class="survey-group">
      <label>The recommendations seemed to have my best interests in mind.</label>
      ${buildLikert("trust3")}
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
  </div>

  <div class="card">
    <div class="section-label">Transparency &amp; Understanding</div>
    <div class="survey-group">
      <label>I understood why these specific items were recommended to me.</label>
      ${buildLikert("transp1")}
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
    <div class="survey-group">
      <label>The recommendation process felt transparent.</label>
      ${buildLikert("transp2")}
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
  </div>

  <div class="card">
    <div class="section-label">Perceived Manipulation / Reactance</div>
    <div class="survey-group">
      <label>The recommendations felt designed to pressure me into spending more.</label>
      ${buildLikert("manip1")}
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
    <div class="survey-group">
      <label>I felt manipulated by the product suggestions.</label>
      ${buildLikert("manip2")}
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
  </div>

  <div class="card">
    <div class="section-label">Decision Confidence</div>
    <div class="survey-group">
      <label>I felt confident in the decision I made at checkout.</label>
      ${buildLikert("conf1")}
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
  </div>

  <div class="card">
    <div class="section-label">Cognitive Load (NASA-TLX adapted)</div>
    <div class="survey-group">
      <label>How mentally demanding was this checkout decision?</label>
      ${buildLikert("load1")}
      <div class="scale-labels"><span>Very low</span><span>Very high</span></div>
    </div>
    <div class="survey-group">
      <label>How much effort did you put into making your decision?</label>
      ${buildLikert("load2")}
      <div class="scale-labels"><span>Very little</span><span>Very much</span></div>
    </div>
    <div class="survey-group">
      <label>How rushed did you feel during the task?</label>
      ${buildLikert("load3")}
      <div class="scale-labels"><span>Not at all</span><span>Very rushed</span></div>
    </div>
  </div>

  <div class="card" id="addon-quality-card" style="display:none">
    <div class="section-label">About the Item(s) You Added</div>
    <div class="survey-group">
      <label>The item(s) I added were relevant to my needs.</label>
      ${buildLikert("fit1")}
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
    <div class="survey-group">
      <label>I might regret adding item(s) to my cart.</label>
      ${buildLikert("regret1")}
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
    <div class="survey-group">
      <label>The item(s) I added offered good value for their price.</label>
      ${buildLikert("value1")}
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
  </div>

  <div class="card">
    <div class="section-label">Manipulation Checks</div>
    <div class="survey-group">
      <label>Approximately how much more did you need to add to reach free shipping?</label>
      <div class="radio-group">
        <label class="radio-opt"><input type="radio" name="manCheck1" value="1"><span>Less than $5</span></label>
        <label class="radio-opt"><input type="radio" name="manCheck1" value="2"><span>Between $5 and $15 <em style="color:var(--muted);font-size:0.8rem">(correct)</em></span></label>
        <label class="radio-opt"><input type="radio" name="manCheck1" value="3"><span>More than $15</span></label>
        <label class="radio-opt"><input type="radio" name="manCheck1" value="4"><span>I wasn't sure</span></label>
      </div>
    </div>
    <div class="survey-group">
      <label>Did the product recommendations include reasons explaining why each item was suggested?</label>
      <div class="radio-group">
        <label class="radio-opt"><input type="radio" name="manCheck2" value="yes"><span>Yes</span></label>
        <label class="radio-opt"><input type="radio" name="manCheck2" value="no"><span>No</span></label>
        <label class="radio-opt"><input type="radio" name="manCheck2" value="unsure"><span>I'm not sure</span></label>
      </div>
    </div>
    <div class="survey-group" style="margin-bottom:0">
      <label>"I was focused on avoiding the shipping fee during this task." <span style="font-weight:400;color:var(--muted)">(1 = Strongly disagree, 7 = Strongly agree)</span></label>
      ${buildLikert("manCheck3")}
      <div class="scale-labels"><span>Strongly disagree</span><span>Strongly agree</span></div>
    </div>
  </div>

  <button class="btn btn-primary" onclick="submitSurvey()">Submit Responses →</button>
</div>

<!-- ⑧ DEBRIEF -->
<div class="screen" id="screen-debrief">
  <div class="thankyou-icon">🎉</div>
  <h1>Thank you!</h1>
  <p id="debrief-note" style="color:var(--warning);font-weight:500;margin-bottom:8px"></p>
  <p>Your responses have been recorded successfully.</p>
  <div class="card">
    <h2>About this study</h2>
    <p>This study examines how different product recommendation systems affect checkout decisions near a free-shipping threshold. We compared a <em>threshold-aware multi-objective recommendation system</em> — which balances your preferences, threshold completion, and retailer priorities — against a <em>standard popularity-based system</em>.</p>
    <p>We are also testing how LLM-generated explanations for recommendations affect trust, perceived manipulation, and decision quality.</p>
    <p style="margin:0">This work is part of an AMCIS 2026 paper on multi-objective decision support for checkout optimization. Your bonus will be applied to your Prolific account within 24 hours.</p>
  </div>
</div>
`;

// Highlight checkboxes on click
document.addEventListener("change", function(e) {
  if (e.target.name === "exitReasonCheck") {
    e.target.closest(".check-opt").classList.toggle("checked", e.target.checked);
  }
});
</script>
</body>
</html>
